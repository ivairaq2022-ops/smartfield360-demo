<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon.svg">
<title>SmartField 360™</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#111318}
.shellbar{height:58px;background:#111318;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #2b2f36}
.brand{display:flex;align-items:center;gap:9px}.brand img{width:36px;height:36px;border-radius:8px}.brand b{font-size:14px}.brand small{display:block;color:#9aa0aa;font-size:9px}
.lang{display:flex;border:1px solid #444b55;border-radius:9px;overflow:hidden}.lang button{border:0;padding:8px 13px;background:#fff;color:#16181d;font-weight:700;font-size:11px;cursor:pointer}.lang button.active{background:#d71920;color:#fff}
iframe{width:100%;height:calc(100vh - 58px);border:0;display:block;background:#f3f5f7}
@media(max-width:600px){.brand small{display:none}.shellbar{height:54px}.brand img{width:32px;height:32px}iframe{height:calc(100vh - 54px)}}
</style>
</head>
<body>
<div class="shellbar">
  <div class="brand"><img src="icons/icon.svg"><div><b>SmartField 360™</b><small>Smart Innovation for Engineering & IT</small></div></div>
  <div class="lang">
    <button id="enBtn">EN</button>
    <button id="arBtn">عربي</button>
  </div>
</div>
<iframe id="appFrame" title="SmartField 360"></iframe>
<script>
(function(){
 const frame=document.getElementById('appFrame');
 const enBtn=document.getElementById('enBtn');
 const arBtn=document.getElementById('arBtn');
 function load(lang){
   localStorage.setItem('sf360-shell-lang',lang);
   frame.src=lang==='ar'?'ar.html':'en.html';
   enBtn.classList.toggle('active',lang==='en');
   arBtn.classList.toggle('active',lang==='ar');
   document.documentElement.lang=lang;
   document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 }
 enBtn.onclick=()=>load('en');
 arBtn.onclick=()=>load('ar');
 load(localStorage.getItem('sf360-shell-lang')||'en');
})();
</script>
</body></html>
