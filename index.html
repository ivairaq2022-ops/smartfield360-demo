<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15171b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon.svg">
<title>SmartField 360</title>
<style>
:root{--red:#d71920;--ink:#17191d;--muted:#6b7280;--bg:#f4f5f7;--card:#fff;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:#15171b;color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:45px;height:45px;border-radius:10px}.brand b{font-size:16px}.brand small{display:block;color:#bbb;font-size:10px}
nav{display:flex;gap:8px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:69px;z-index:4}
nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 12px;font-size:12px}nav button.active{background:#15171b;color:#fff}
main{padding:14px;max-width:1100px;margin:auto}.hero{background:linear-gradient(110deg,#181a1f,#30333a);color:#fff;border-radius:14px;padding:18px;margin-bottom:14px}.hero h2{margin:0 0 6px;font-size:20px}.hero p{margin:0;color:#d0d3d8;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.k{font-size:10px;text-transform:uppercase;color:var(--muted)}.v{font-size:22px;font-weight:700;margin:7px 0}.sub{font-size:10px;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;overflow:auto}.panel h3{margin:0 0 12px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:11px;min-width:620px}th,td{text-align:left;padding:9px;border-bottom:1px solid #eee}th{font-size:9px;text-transform:uppercase;color:#666}
.status{padding:4px 7px;border-radius:10px;font-size:9px;background:#eee}.Producing,.Approved,.Running,.Active{background:#dcfce7;color:#166534}.Down,.Critical,.Rejected{background:#fee2e2;color:#991b1b}.Maintenance,.Pending,.Degraded{background:#fef3c7;color:#92400e}.Shut-in{background:#e5e7eb;color:#374151}
.map{height:330px;background:linear-gradient(35deg,#f7f7f7,#e8eaed);border-radius:12px;position:relative}.well{position:absolute;width:20px;height:20px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px #555}.prod{background:#16a34a}.down{background:#dc2626}.maint{background:#d97706}.shut{background:#374151}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:20px}.modal.show{display:flex;align-items:center;justify-content:center}.modalbox{background:#fff;border-radius:14px;padding:18px;max-width:760px;width:100%;max-height:88vh;overflow:auto}.close{float:right;font-size:22px}.install{border:0;background:var(--red);color:#fff;border-radius:8px;padding:8px 11px;font-size:11px}
@media(min-width:800px){.cards{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body>
<header><div class="brand"><img src="icons/icon.svg"><div><b>SmartField 360™</b><small>Smart Innovation</small></div></div><button class="install" id="installBtn" style="display:none">Install App</button></header>
<nav id="nav"></nav><main id="app"></main>
<div id="modal" class="modal"><div class="modalbox"><span class="close" onclick="modal.classList.remove('show')">×</span><div id="modalContent"></div></div></div>
<script>
const data={
wells:[
{code:"WF-001",name:"North-01",zone:"North",status:"Producing",oil:2340,target:2500,watercut:12.4,pressure:1850,last:"2026-09-03",next:"2026-10-03"},
{code:"WF-002",name:"North-02",zone:"North",status:"Producing",oil:2180,target:2200,watercut:10.1,pressure:1770,last:"2026-08-28",next:"2026-09-28"},
{code:"WF-003",name:"North-03",zone:"North",status:"Down",oil:0,target:1900,watercut:18.2,pressure:0,last:"2026-09-10",next:"2026-09-18"},
{code:"WF-004",name:"Central-01",zone:"Central",status:"Maintenance",oil:0,target:2100,watercut:15.5,pressure:420,last:"2026-09-18",next:"2026-09-18"},
{code:"WF-005",name:"Central-02",zone:"Central",status:"Producing",oil:2750,target:2600,watercut:8.9,pressure:1910,last:"2026-08-21",next:"2026-09-21"},
{code:"WF-006",name:"South-01",zone:"South",status:"Producing",oil:1980,target:2050,watercut:13.0,pressure:1690,last:"2026-09-01",next:"2026-10-01"},
{code:"WF-007",name:"South-02",zone:"South",status:"Shut-in",oil:0,target:1750,watercut:21.4,pressure:0,last:"2026-07-19",next:"2026-09-30"},
{code:"WF-008",name:"South-03",zone:"South",status:"Producing",oil:2430,target:2400,watercut:9.8,pressure:1835,last:"2026-08-30",next:"2026-09-30"}],
assets:[
{tag:"P-101",name:"Main Transfer Pump",category:"Pump",status:"Running",criticality:"Critical",location:"CPF"},
{tag:"C-04",name:"Gas Compressor 04",category:"Compressor",status:"Maintenance",criticality:"Critical",location:"Compression Station"},
{tag:"TK-11",name:"Crude Storage Tank 11",category:"Tank",status:"Running",criticality:"High",location:"Tank Farm"}],
workorders:[
{wo:"WO-26091",asset:"ESP Pump / WF-003",type:"Corrective",priority:"Critical",status:"Open",owner:"Maintenance A"},
{wo:"WO-26092",asset:"Compressor C-04",type:"Preventive",priority:"High",status:"In Progress",owner:"Mechanical"}],
inventory:[
{sku:"SP-ESP-001",item:"ESP Seal Kit",qty:3,min:5,unit:"EA"},
{sku:"INS-PT-014",item:"Pressure Transmitter",qty:11,min:8,unit:"EA"},
{sku:"VAL-GV-004",item:"4in Gate Valve",qty:2,min:4,unit:"EA"}],
hse:[
{ref:"HSE-26031",category:"Near Miss",severity:"Low",status:"Closed",area:"CPF"},
{ref:"HSE-26032",category:"Inspection Finding",severity:"Medium",status:"Open",area:"Tank Farm"}],
finance:[
{category:"Maintenance",type:"OPEX",budget:220000,actual:184000},
{category:"Operations",type:"OPEX",budget:310000,actual:298000},
{category:"Well Intervention",type:"OPEX",budget:145000,actual:171000},
{category:"Facility Upgrade",type:"CAPEX",budget:500000,actual:210000}],
approvals:[
{ref:"APR-1001",module:"Procurement",description:"ESP spare parts package",amount:185000,status:"Pending"},
{ref:"APR-1002",module:"Maintenance",description:"Emergency generator corrective work",amount:7600,status:"Pending"}]};
const sections=["Dashboard","Wells","Assets","Maintenance","Warehouse","HSE","Finance","Approvals","Integration"];
const nav=document.getElementById('nav'),app=document.getElementById('app');
sections.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>render(s,b);if(i===0)b.classList.add('active');nav.appendChild(b)});
function T(rows,cols){return '<table><thead><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+((c[0]==='status'||c[0]==='priority')?'<span class="status '+r[c[0]]+'">'+r[c[0]]+'</span>':r[c[0]])+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function render(s,b){[...nav.children].forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');let h='';
if(s==='Dashboard'){let oil=data.wells.reduce((a,x)=>a+x.oil,0),tar=data.wells.reduce((a,x)=>a+x.target,0),act=data.wells.filter(x=>x.status==='Producing').length;h='<div class="hero"><h2>Integrated Oilfield Operations Command Center</h2><p>Mobile / Tablet Demo • SAP-Ready • SCADA-Ready • Smart Innovation</p></div><div class="cards"><div class="card"><div class="k">Production</div><div class="v">'+oil.toLocaleString()+'</div><div class="sub">BBL/day</div></div><div class="card"><div class="k">Target</div><div class="v">'+tar.toLocaleString()+'</div></div><div class="card"><div class="k">Producing Wells</div><div class="v">'+act+'/'+data.wells.length+'</div></div><div class="card"><div class="k">Production Gap</div><div class="v">'+(tar-oil).toLocaleString()+'</div></div></div><div class="panel"><h3>Field Overview</h3>'+T(data.wells,[['code','Well'],['status','Status'],['oil','Oil'],['target','Target'],['pressure','PSI']])+'</div>'}
if(s==='Wells'){let pos=[[18,25],[36,18],[55,28],[70,18],[28,57],[48,65],[68,55],[82,70]];h='<div class="panel"><h3>Digital Oilfield Map</h3><div class="map">'+data.wells.map((w,i)=>'<div onclick="well(\''+w.code+'\')" class="well '+(w.status==='Producing'?'prod':w.status==='Down'?'down':w.status==='Maintenance'?'maint':'shut')+'" style="left:'+pos[i][0]+'%;top:'+pos[i][1]+'%"></div>').join('')+'</div></div><div class="panel">'+T(data.wells,[['code','Well'],['name','Name'],['zone','Zone'],['status','Status'],['oil','Oil'],['target','Target'],['watercut','Water %'],['pressure','PSI']])+'</div>'}
if(s==='Assets')h='<div class="panel"><h3>Asset Registry</h3>'+T(data.assets,[['tag','Tag'],['name','Asset'],['category','Category'],['status','Status'],['criticality','Criticality'],['location','Location']])+'</div>';
if(s==='Maintenance')h='<div class="panel"><h3>Maintenance Work Orders</h3>'+T(data.workorders,[['wo','WO'],['asset','Asset'],['type','Type'],['priority','Priority'],['status','Status'],['owner','Owner']])+'</div>';
if(s==='Warehouse')h='<div class="panel"><h3>Warehouse & Critical Spares</h3>'+T(data.inventory,[['sku','SKU'],['item','Item'],['qty','Qty'],['min','Min'],['unit','Unit']])+'</div>';
if(s==='HSE')h='<div class="panel"><h3>HSE</h3>'+T(data.hse,[['ref','Ref'],['category','Category'],['severity','Severity'],['status','Status'],['area','Area']])+'</div>';
if(s==='Finance'){let bgt=data.finance.reduce((a,x)=>a+x.budget,0),act=data.finance.reduce((a,x)=>a+x.actual,0);h='<div class="cards"><div class="card"><div class="k">Budget</div><div class="v">$'+bgt.toLocaleString()+'</div></div><div class="card"><div class="k">Actual</div><div class="v">$'+act.toLocaleString()+'</div></div><div class="card"><div class="k">Variance</div><div class="v">$'+(bgt-act).toLocaleString()+'</div></div><div class="card"><div class="k">Utilization</div><div class="v">'+Math.round(act/bgt*100)+'%</div></div></div><div class="panel">'+T(data.finance,[['category','Category'],['type','Type'],['budget','Budget'],['actual','Actual']])+'</div>'}
if(s==='Approvals')h='<div class="panel"><h3>Approval Workflow</h3>'+T(data.approvals,[['ref','Ref'],['module','Module'],['description','Description'],['amount','Amount'],['status','Status']])+'</div>';
if(s==='Integration')h='<div class="hero"><h2>Secure SAP / SCADA Integration</h2><p>Field / OT → Industrial DMZ → Integration Gateway → SmartField 360 → SAP / ERP</p></div><div class="cards"><div class="card"><div class="k">Field / OT</div><div class="v">SCADA</div><div class="sub">PLC • sensors • historian</div></div><div class="card"><div class="k">DMZ</div><div class="v">GW</div><div class="sub">Controlled integration</div></div><div class="card"><div class="k">Operations</div><div class="v">360</div><div class="sub">SmartField workflows</div></div><div class="card"><div class="k">Enterprise</div><div class="v">SAP</div><div class="sub">Assets • materials • costs</div></div></div>';
app.innerHTML=h}
function well(code){let w=data.wells.find(x=>x.code===code);modalContent.innerHTML='<h2>'+w.code+' · '+w.name+'</h2><p><b>Status:</b> '+w.status+' | <b>Zone:</b> '+w.zone+'</p><div class="cards"><div class="card"><div class="k">Oil</div><div class="v">'+w.oil+'</div></div><div class="card"><div class="k">Target</div><div class="v">'+w.target+'</div></div><div class="card"><div class="k">Pressure</div><div class="v">'+w.pressure+'</div></div><div class="card"><div class="k">Water Cut</div><div class="v">'+w.watercut+'%</div></div></div><p><b>Last maintenance:</b> '+w.last+'<br><b>Next PM:</b> '+w.next+'</p>';modal.classList.add('show')}
render('Dashboard',nav.children[0]);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='block'});installBtn.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;installBtn.style.display='none'}};
</script></body></html>
